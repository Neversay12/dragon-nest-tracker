<style>
/* Layout: a raid logbook. Character tabs on top, collapsible ledgers below, pips as the tally marks. */
:root{
  --bg:#e9edf3;--surface:#fff;--raised:#f3f5f9;--ink:#192033;--muted:#566077;--line:#d2d8e3;
  --accent:#2453c4;--on-accent:#fff;--hard:#c23a28;--hard-soft:#fbe7e3;--done:#1e7d55;--done-soft:#def3e9;
  --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141d;--surface:#1a1f2d;--raised:#232a3b;--ink:#e9ecf4;--muted:#a0a9bd;--line:#30384c;
  --accent:#86a8ff;--on-accent:#10131c;--hard:#ff9583;--hard-soft:#3b211f;--done:#5dd6a0;--done-soft:#17352a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141d;--surface:#1a1f2d;--raised:#232a3b;--ink:#e9ecf4;--muted:#a0a9bd;--line:#30384c;
  --accent:#86a8ff;--on-accent:#10131c;--hard:#ff9583;--hard-soft:#3b211f;--done:#5dd6a0;--done-soft:#17352a;color-scheme:dark}
:root{--art:none}
:root[data-skin="dark"]{--bg:#11141d;--surface:#1a1f2d;--raised:#232a3b;--ink:#e9ecf4;--muted:#a0a9bd;--line:#30384c;--accent:#86a8ff;--on-accent:#10131c;--hard:#ff9583;--hard-soft:#3b211f;--done:#5dd6a0;--done-soft:#17352a;--art:none;color-scheme:dark}
:root[data-skin="light"]{--bg:#e9edf3;--surface:#fff;--raised:#f3f5f9;--ink:#192033;--muted:#566077;--line:#d2d8e3;--accent:#2453c4;--on-accent:#fff;--hard:#c23a28;--hard-soft:#fbe7e3;--done:#1e7d55;--done-soft:#def3e9;--art:none;color-scheme:light}
:root[data-skin="lava"]{--bg:#190d0b;--surface:#261512;--raised:#351d18;--ink:#f8ebe5;--muted:#c6a79c;--line:#4f2d25;--accent:#ffa45c;--on-accent:#21100a;--hard:#ff8f7d;--hard-soft:#47201b;--done:#ffd166;--done-soft:#40301a;--art:radial-gradient(90% 60% at 85% 0%,#6d2413 0%,transparent 70%),radial-gradient(70% 50% at 0% 100%,#4a1a10 0%,transparent 70%);color-scheme:dark}
:root[data-skin="ocean"]{--bg:#081820;--surface:#0f2530;--raised:#163341;--ink:#e4f4f8;--muted:#96b9c4;--line:#27495a;--accent:#5fd4e8;--on-accent:#06171d;--hard:#ff9f8f;--hard-soft:#3a2830;--done:#6fe3bd;--done-soft:#123d38;--art:radial-gradient(90% 60% at 15% 0%,#14506a 0%,transparent 70%),radial-gradient(70% 50% at 100% 100%,#0e3b55 0%,transparent 70%);color-scheme:dark}
:root[data-skin="forest"]{--bg:#0e1710;--surface:#172319;--raised:#203023;--ink:#e9f3e6;--muted:#a3b8a2;--line:#33483a;--accent:#a8dc6c;--on-accent:#101a0b;--hard:#ffa08a;--hard-soft:#3a2720;--done:#7fe0a0;--done-soft:#1b3d29;--art:radial-gradient(90% 60% at 80% 0%,#2c5230 0%,transparent 70%),radial-gradient(70% 50% at 0% 100%,#1e3d27 0%,transparent 70%);color-scheme:dark}
:root[data-skin="sakura"]{--bg:#fbeef2;--surface:#fffafb;--raised:#fdeaf0;--ink:#38202b;--muted:#7b5866;--line:#efd0db;--accent:#c23468;--on-accent:#fff;--hard:#b92f2f;--hard-soft:#fde2e0;--done:#23805f;--done-soft:#dff3ea;--art:radial-gradient(80% 50% at 90% 0%,#f8c9d9 0%,transparent 70%),radial-gradient(70% 50% at 0% 100%,#fbdbe5 0%,transparent 70%);color-scheme:light}
:root{--daily:#8a5200;--daily-soft:#fdf0d5;--weekly:#6a35b8;--weekly-soft:#efe6fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--daily:#ffcf70;--daily-soft:#3d2f12;--weekly:#c9a6ff;--weekly-soft:#2e2445}}
:root[data-theme="dark"],:root[data-skin="dark"],:root[data-skin="lava"],:root[data-skin="ocean"],:root[data-skin="forest"]{--daily:#ffcf70;--daily-soft:#3d2f12;--weekly:#c9a6ff;--weekly-soft:#2e2445}
:root[data-skin="light"],:root[data-skin="sakura"]{--daily:#8a5200;--daily-soft:#fdf0d5;--weekly:#6a35b8;--weekly-soft:#efe6fb}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--art);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:960px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--display);font-size:26px;line-height:1.2;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.clocks{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.clock span{display:block;font-size:12px;color:var(--muted)}
.clock b{font-family:var(--display);font-size:17px;font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.tab{flex:none;min-width:128px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 11px}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab{display:flex;align-items:center;gap:9px;min-width:178px}
.tabtxt{flex:1;min-width:0;display:block}
.tab strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.avatar{flex:none;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:6px;overflow:hidden;background:var(--raised);border:1px solid var(--line);color:var(--accent);font-family:var(--display);font-weight:700;font-size:18px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:68px;height:68px;font-size:28px;border-radius:8px}
.avatar.xl{width:88px;height:88px;font-size:34px;border-radius:8px}
.avatar.sm{width:30px;height:30px;font-size:13px;border-radius:4px}
.hero{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;min-width:0}
.hero:hover .avatar{border-color:var(--accent)}
.herotxt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.jobpill{font-size:13px;font-weight:600;color:var(--accent);background:var(--raised);border-radius:3px;padding:0 7px}
.herotxt small{font-size:13px;color:var(--muted)}
.skins{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.skins>span{font-size:13px;color:var(--muted);margin-right:2px}
.skin{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:2px 10px 2px 6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:13px}
.skin i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}
.skin[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.imgdrop{display:flex;gap:12px;align-items:center;padding:10px;border:1.5px dashed var(--line);border-radius:7px;background:var(--bg)}
.imgdrop.over{border-color:var(--accent)}
.imgdrop b{display:block;font-weight:600;font-size:14px}
.imgdrop small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.imgdrop .btns{display:flex;flex-wrap:wrap;gap:4px}
th .thc{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
th small{font-weight:400;font-size:11px;color:var(--muted)}
.tab small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.bar{display:block;height:3px;background:var(--line);margin-top:4px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done)}
.tab.add{min-width:0;border-style:dashed;color:var(--accent);font-weight:600;display:flex;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.toolbar>div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:5px 11px;font-size:14px;min-height:34px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.danger{color:var(--hard);border-color:var(--hard)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{min-height:28px;padding:1px 8px;font-size:13px}
.btn.tool{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:6px 14px;font-weight:600;background:var(--raised);border:1.5px solid var(--line)}
.btn.tool svg{width:17px;height:17px;flex:none;color:var(--accent)}
.btn.tool:hover{border-color:var(--accent);background:var(--surface)}
.btn.tool[aria-pressed="true"],.btn.tool[aria-pressed="true"]:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.tool[aria-pressed="true"] svg{color:inherit}
.btn.edit,.btn.warn{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:4px 12px;font-size:14px;font-weight:600}
.btn.edit svg,.btn.warn svg{width:16px;height:16px;flex:none}
.btn.edit{background:var(--raised);border:1.5px solid var(--line)}
.btn.warn{color:var(--hard);background:var(--hard-soft);border:2px solid var(--hard)}
.btn.warn:hover{color:var(--surface);background:var(--hard);border-color:var(--hard)}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.toolgrid .btn.tool{justify-content:flex-start;text-align:left;gap:10px;padding:8px 12px;min-width:0}
.toolgrid .btn.tool svg{width:21px;height:21px}
.tt{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.tt b{font-weight:600}
.tt small{font-weight:400;font-size:12px;color:var(--muted)}
.btn[aria-pressed="true"] .tt small,.btn.warn .tt small{color:inherit}
.btn.edit,.btn.warn{text-align:left}
#app{position:relative;z-index:1}
#toast{z-index:5}
#bgImg{position:fixed;inset:calc(var(--wblur,0px) * -2);z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;filter:blur(var(--wblur,0px))}
#bgImg::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--dim,.4)}
.skinbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.skin.bgbtn{padding:2px 12px 2px 8px;font-weight:600;border-style:dashed;border-color:var(--accent);color:var(--accent)}
.skin.bgbtn svg,.skin.snd svg{width:17px;height:17px;flex:none}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.langs button{min-height:32px;padding:2px 11px;border:0;background:none;font-size:13px;font-weight:600;color:var(--muted)}
.langs button+button{border-left:1px solid var(--line)}
.langs button:hover{color:var(--ink)}
.langs button[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.skin.snd{padding:2px 12px 2px 8px;font-weight:600}
.skin.snd svg{color:var(--accent)}
.skin.snd.off{color:var(--muted)}
.skin.snd.off svg{color:var(--muted)}
.has-bg header,.has-bg .skinbar{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 12px}
.has-bg .section-label,.has-bg footer{width:fit-content;max-width:100%;background:none;color:var(--ink);padding:0}
.field input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
.gtoggle .gcount{display:inline-flex;align-items:center;gap:5px}
.gcount svg{width:16px;height:16px;flex:none;stroke-width:3}
.group.complete{border:1.5px solid var(--done)}
.group.complete .ghead{background:var(--done-soft)}
.group.complete .gname,.group.complete .gcount,.group.complete .sign{color:var(--done)}
.group.complete .gcount{font-weight:600}
.group.complete .empty{background:var(--done-soft);color:var(--done);border-top-color:var(--done)}
.row.daily{--stripe:var(--daily);box-shadow:inset 4px 0 0 var(--stripe)}
.row.weekly{--stripe:var(--weekly);box-shadow:inset 4px 0 0 var(--stripe)}
.leader{flex:1 1 24px;min-width:24px;align-self:center;border-bottom:2px dotted transparent}
.row.picked:not(.dragging),.row:not(.dragging):has(:focus-visible){background:var(--raised);background:color-mix(in srgb,var(--accent) 18%,var(--surface));box-shadow:inset 4px 0 0 var(--stripe),inset 0 0 0 2px var(--accent)}
.row.picked .leader,.row:has(:focus-visible) .leader{border-bottom-color:var(--accent)}
.row.picked .pip:not(.on){border-color:var(--accent)}
@media (hover:hover){
  body:not(.is-dragging) .row:not(.dragging):hover{background:var(--raised);background:color-mix(in srgb,var(--accent) 18%,var(--surface));box-shadow:inset 4px 0 0 var(--stripe),inset 0 0 0 2px var(--accent)}
  body:not(.is-dragging) .row:hover .leader{border-bottom-color:var(--accent)}
  body:not(.is-dragging) .row:hover .pip:not(.on){border-color:var(--accent)}
}
@media (max-width:620px){.leader{display:none}}
.layoutbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tag.daily{background:var(--daily-soft);color:var(--daily);font-weight:600}
.tag.weekly{background:var(--weekly-soft);color:var(--weekly);font-weight:600}
.drag{flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:5px;cursor:grab;touch-action:none;user-select:none;color:var(--muted)}
.drag svg{width:20px;height:20px}
.ghead .drag{margin-left:6px}
.row[data-grab]{cursor:grab}
.row[data-grab] button{cursor:pointer}
.group.lifted>:not(.ghead){display:none}
.drop-slot{flex:none;border:2px dashed var(--accent);border-radius:6px;background:var(--raised)}
.is-dragging,.is-dragging *{cursor:grabbing!important;user-select:none}
.drag:hover{color:var(--accent);background:var(--raised)}
.row.dragging,.group.dragging{background:var(--surface);opacity:.97;border-radius:6px;box-shadow:0 12px 30px rgba(8,10,18,.45),0 0 0 2px var(--accent)}
.row.dragging .drag{cursor:grabbing}
.btn:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.manage{flex-wrap:wrap}
.gtoggle .gname{min-width:0}
.gtoggle .gcount{flex:none;white-space:nowrap}
@media (max-width:760px){
  .ghead{flex-wrap:wrap;padding-right:0}
  .ghead .gtoggle{flex:1 1 calc(100% - 44px)}
  .ghead .manage{padding:0 12px 9px}
}
.skin.syncp svg{color:var(--muted)}
.skin.syncp[data-state="ok"]{color:var(--done);border-color:var(--done)}
.skin.syncp[data-state="ok"] svg{color:var(--done)}
.skin.syncp[data-state="saving"],.skin.syncp[data-state="connecting"]{color:var(--accent);border-color:var(--accent)}
.skin.syncp[data-state="saving"] svg,.skin.syncp[data-state="connecting"] svg{color:var(--accent)}
.skin.syncp[data-state="error"]{color:var(--hard);border-color:var(--hard)}
.skin.syncp[data-state="error"] svg{color:var(--hard)}
.qrwrap{align-self:center;width:fit-content;background:#fff;padding:10px;border-radius:6px;min-width:204px;min-height:204px}
.qrwrap img,.qrwrap canvas{display:block;max-width:100%}
.skin.upd svg{color:var(--accent)}
.skin.upd.ready{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.skin.upd.ready svg{color:inherit}
.skin.upd:disabled{opacity:.7;cursor:default}
.ptr-on,.ptr-on body{overscroll-behavior-y:contain}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:6;display:flex;align-items:center;gap:7px;padding:6px 13px;white-space:nowrap;border-radius:18px;background:var(--surface);color:var(--ink);border:1.5px solid var(--accent);font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(8,10,18,.35);pointer-events:none;transform:translate(-50%,-56px)}
#ptr svg{width:17px;height:17px;flex:none;color:var(--accent)}
#ptr svg.spin{animation:ptr-spin .8s linear infinite}
@keyframes ptr-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#ptr svg.spin{animation:none}}
.tab[data-char]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tab.dragging{background:var(--surface);opacity:.97;box-shadow:0 12px 30px rgba(8,10,18,.45),0 0 0 2px var(--accent)}
.tab-grip{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:34px;margin-left:-4px;color:var(--muted);cursor:grab;touch-action:none}
.tab-grip svg{width:17px;height:17px}
.linkbanner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--accent);border-radius:7px}
.linkbanner b{display:block;font-weight:600}
.linkbanner small{display:block;font-size:12px;color:var(--muted)}
.scanbox{position:relative;width:100%;aspect-ratio:1;max-height:60vh;overflow:hidden;background:#000;border-radius:6px}
.scanbox video{display:block;width:100%;height:100%;object-fit:cover}
.scanbox i{position:absolute;inset:15%;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.homesteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink)}
.homesteps b{font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.qrguard{display:flex;justify-content:center}
.qrcover{width:204px;height:204px;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;background:var(--raised);border:1.5px dashed var(--line);border-radius:6px}
.qrcover svg{width:28px;height:28px;color:var(--accent)}
.qrcover b{font-weight:600;color:var(--ink)}
.qrcover small{font-size:12px;line-height:1.35;color:var(--muted)}
#sHide{align-self:center}
.undo-list{display:flex;flex-direction:column;gap:6px}
.sync-or{border-top:1px solid var(--line);margin:2px 0}
.sndgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sndopt{display:flex;flex-direction:column;gap:1px;min-width:0;text-align:left;padding:8px 10px;background:var(--raised);border:1.5px solid var(--line);border-radius:6px}
.sndopt b{font-weight:600;color:var(--ink)}
.sndopt small{font-size:12px;line-height:1.3;color:var(--muted)}
.sndopt:hover{border-color:var(--accent)}
.sndopt[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#dlg .langs{align-self:flex-start;max-width:100%}
.charcard{background:var(--surface);border:1.5px solid var(--line);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:8px;padding:12px 14px}
.guide{margin:0;padding:8px 12px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px}
.guide b{color:var(--ink);font-weight:600}
.guide.editing{border-color:var(--accent);color:var(--ink)}
.passrow{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.passrow em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:50px}
@media (max-width:620px){.toolgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolgrid .btn.tool{padding:7px 9px;gap:7px}}

const LANGS=[['th','ไทย'],['en','EN'],['mix','ไทย+EN']];
let lang='mix';

document.documentElement.lang=lang==='en'?'en':'th';
const trCache={};
function trTable(){
  if(trCache[lang]) return trCache[lang];
  const map=new Map();
  DICT.forEach(e=>{const to=lang==='en'?e[1]:lang==='mix'?e[2]:e[3];if(to!==undefined) map.set(e[0],to)});
  const keys=[...map.keys()].sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&'));
  return trCache[lang]={map,re:keys.length?new RegExp(keys.join('|'),'g'):null};
}
function tr(s){
  const t=trTable();
  return String(s).split(/([^]*)/).map(p=>p[0]===''?p.slice(1,-1):(t.re?p.replace(t.re,m=>t.map.get(m)):p)).join('');
}
const mark=s=>{s=String(s);return SEED_NAMES.has(s)?s:''+s+''};
const esc=s=>escPlain(mark(s));
const keep=s=>escPlain(''+s+'');

function migrateGuild(s){

  const moved=[];
  s.groups.filter(g=>g.kind==='quest').forEach(g=>{
    g.items=g.items.filter(i=>{
      if(i.name==='เช็คชื่อกิลด์'||i.name==='ส่งของกิลด์'){moved.push(i);return false}
      return true;
    });
    if(g.name==='เควสและกิลด์') g.name='เควสทั่วไป';
  });
  let last=-1;
  s.groups.forEach((g,k)=>{if(g.kind==='quest') last=k});

function toAvatar(file){return new Promise((ok,no)=>{
  if(file.size>15e6) return no(new Error('big'));
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{
    const n=192,cv=document.createElement('canvas'),w=im.naturalWidth,h=im.naturalHeight,s=Math.min(w,h);
    cv.width=cv.height=n;const x=cv.getContext('2d');
    x.fillStyle='#20263a';x.fillRect(0,0,n,n);x.drawImage(im,(w-s)/2,(h-s)/2,s,s,0,0,n,n);
    URL.revokeObjectURL(u);
    let d=cv.toDataURL('image/webp',.82);
    if(!d.startsWith('data:image/webp')) d=cv.toDataURL('image/jpeg',.82);

  };
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('bad'))};
  im.src=u;
})}

function clampInt(v,min,max){v=Math.floor(Number(v));return Number.isFinite(v)?Math.min(max,Math.max(min,v)):min}
function clean(x){
  if(!x||!Array.isArray(x.chars)||!Array.isArray(x.groups)||!x.chars.length) throw new Error('bad');
  const now=Date.now();
  const s={v:5,view:x.view==='all'?'all':'char',hideDone:!!x.hideDone,collapsed:x.collapsed&&typeof x.collapsed==='object'?x.collapsed:{},progress:{},
    stamps:{daily:Number(x.stamps&&x.stamps.daily)||dayStart(now),weekly:Number(x.stamps&&x.stamps.weekly)||weekStart(now)},
    chars:x.chars.map(c=>({id:String(c.id||uid()),name:String(c.name||'ตัวละคร').slice(0,40),job:String(c.job||'').slice(0,40),img:safeImg(c.img)})),
    groups:x.groups.map(g=>({id:String(g.id||uid()),kind:g.kind==='quest'?'quest':'dungeon',name:String(g.name||'หมวดหมู่').slice(0,60),
      items:(Array.isArray(g.items)?g.items:[]).map(i=>({id:String(i.id||uid()),name:String(i.name||'รายการ').slice(0,80),clear:clampInt(i.clear,1,9999),fail:clampInt(i.fail,0,9999),tier:i.tier==='hard'?'hard':'normal',reset:i.reset==='daily'?'daily':'weekly'}))}))};
  // Version 1 shipped two default fail limits. Remove them once; limits set after this are kept.
  const fromV=Number(x.v)||1;
  if(fromV<2) s.groups.forEach(g=>g.items.forEach(i=>{if(i.fail===10&&(i.name==='Cerberus Nest'||i.name==='Sea Dragon Nest (ยาก)')) i.fail=0}));
  // Version 3 lists Daily before Weekly once. After this the user's own order is kept.
  if(fromV<3) s.groups.filter(g=>g.kind==='quest').forEach(g=>{g.items=[...g.items.filter(i=>i.reset==='daily'),...g.items.filter(i=>i.reset!=='daily')]});
  // Version 4 raises the default Weekly Quest from 6 to 7 once. A count the user sets later is kept.
  if(fromV<4) s.groups.forEach(g=>g.items.forEach(i=>{if(i.name==='เควสรายสัปดาห์'&&i.clear===6) i.clear=7}));
  if(fromV<5) migrateGuild(s);
  const p=x.progress&&typeof x.progress==='object'?x.progress:{};
  s.chars.forEach(c=>{const o=p[c.id];if(!o||typeof o!=='object')return;s.progress[c.id]={};
    for(const k in o){s.progress[c.id][k]={c:clampInt(o[k]&&o[k].c,0,9999),f:clampInt(o[k]&&o[k].f,0,9999)}}});
  s.active=s.chars.some(c=>c.id===x.active)?x.active:s.chars[0].id;
  return s;
}

function hexA(v,a){
  let h=String(v).trim().replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-f]{6}$/i.test(h)) return v;
  const n=parseInt(h,16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function paintWall(){
  const el=$('#bgImg'),app=$('#app'),box=$('#wallDlg'),root=document.documentElement;
  if(!el||!app) return;
  const has=!!wall.img,css=getComputedStyle(root),surface=css.getPropertyValue('--surface'),ink=css.getPropertyValue('--ink');
  el.hidden=!has;
  el.style.backgroundImage=has?'url("'+wall.img+'")':'none';
  el.style.setProperty('--dim',1-wall.show/100);
  el.style.setProperty('--wblur',wall.blur+'px');
  root.classList.toggle('has-bg',has);
  root.classList.toggle('wall-pb',has&&wall.pblur>0);
  root.style.setProperty('--wpblur',wall.pblur+'px');
  const light=wallTone()==='l',accent=skin==='sakura'?'#ff8db7':'#86a8ff',onAccent=skin==='sakura'?'#2a0b18':'#10131c';
  [app,box].forEach(x=>{
    if(has&&light){x.style.setProperty('--accent',accent);x.style.setProperty('--on-accent',onAccent)}
    else{x.style.removeProperty('--accent');x.style.removeProperty('--on-accent')}
  });
  if(has){
    app.style.setProperty('--surface','rgba(14,16,24,'+wall.glass/100+')');
    app.style.setProperty('--chip','rgba(14,16,24,'+Math.max(wall.glass,34)/100+')');
    box.style.setProperty('--wside','rgba(14,16,24,.36)');
    box.style.setProperty('--wpanel','rgba(14,16,24,.4)');
    box.style.setProperty('--wline','rgba(255,255,255,.17)');
    box.style.setProperty('--whover','rgba(255,255,255,.15)');
  }else{
    app.style.removeProperty('--surface');app.style.removeProperty('--chip');
    box.style.setProperty('--wside',hexA(surface,.62));
    box.style.setProperty('--wpanel',hexA(surface,.72));
    box.style.setProperty('--wline',hexA(ink,.16));
    box.style.setProperty('--whover',hexA(ink,.13));
  }
}

let wdbP=null,wallMem=false;
const wmem={meta:new Map(),full:new Map()};
function wdb(){
  return wdbP||(wdbP=new Promise((ok,no)=>{
    try{
      const r=indexedDB.open('dn-wallpapers',1);
      r.onupgradeneeded=()=>{r.result.createObjectStore('meta',{keyPath:'id'});r.result.createObjectStore('full',{keyPath:'id'})};
      r.onsuccess=()=>ok(r.result);
      r.onerror=()=>no(r.error);
      r.onblocked=()=>no(new Error('blocked'));
    }catch(e){no(e)}
  }).catch(e=>{wallMem=true;return null}));
}
async function wallList(){
  const db=await wdb();
  if(!db) return Array.from(wmem.meta.values()).sort((a,b)=>b.at-a.at);
  return new Promise((ok,no)=>{const q=db.transaction('meta').objectStore('meta').getAll();q.onsuccess=()=>ok(q.result.sort((a,b)=>b.at-a.at));q.onerror=()=>no(q.error)});
}
async function wallFull(id){
  const db=await wdb();
  if(!db) return wmem.full.get(id)||null;
  return new Promise((ok,no)=>{const q=db.transaction('full').objectStore('full').get(id);q.onsuccess=()=>ok(q.result&&q.result.img||null);q.onerror=()=>no(q.error)});
}
async function wallPut(meta,img){
  const db=await wdb();
  if(!db){wmem.meta.set(meta.id,meta);wmem.full.set(meta.id,img);return}
  return new Promise((ok,no)=>{const t=db.transaction(['meta','full'],'readwrite');t.objectStore('meta').put(meta);t.objectStore('full').put({id:meta.id,img});t.oncomplete=()=>ok();t.onerror=t.onabort=()=>no(t.error||new Error('store'))});
}
async function wallRemove(id){
  const db=await wdb();
  if(!db){wmem.meta.delete(id);wmem.full.delete(id);return}
  return new Promise((ok,no)=>{const t=db.transaction(['meta','full'],'readwrite');t.objectStore('meta').delete(id);t.objectStore('full').delete(id);t.oncomplete=()=>ok();t.onerror=t.onabort=()=>no(t.error||new Error('store'))});
}
function wallThumb(im){
  const cv=document.createElement('canvas');cv.width=480;cv.height=300;
  const r=Math.max(480/im.naturalWidth,300/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r,x=cv.getContext('2d');
  x.fillStyle='#11141d';x.fillRect(0,0,480,300);x.drawImage(im,(480-w)/2,(300-h)/2,w,h);
  return cv.toDataURL('image/jpeg',.74);
}
const readData=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=()=>no(new Error('bad'));r.readAsDataURL(f)});
function wallMake(file){return new Promise((ok,no)=>{
  if(file.size>25e6) return no(new Error('big'));
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=async()=>{
    try{
      const make=(max,q)=>{
        const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(im.naturalWidth*r));cv.height=Math.max(1,Math.round(im.naturalHeight*r));
        const x=cv.getContext('2d');x.fillStyle='#11141d';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);
        return cv.toDataURL('image/jpeg',q);
      };
      let img;
      if(file.type==='image/gif'&&file.size<=6e6) img=await readData(file); // keeps the animation
      else{img=make(2560,.86);if(img.length>4e6) img=make(1920,.8);if(img.length>4e6) img=make(1600,.72)}
      ok({img,thumb:wallThumb(im)});
    }catch(e){no(new Error('bad'))}
    URL.revokeObjectURL(u);
  };
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('bad'))};
  im.src=u;
})}
async function wallBoot(){

  try{
    if(legacy){
      wall.img=legacy;paintWall();
      const im=new Image();
      await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=legacy});
      const meta={id:'w-'+uid(),name:'',at:Date.now(),thumb:wallThumb(im)};
      await wallPut(meta,legacy);
      wall.id=meta.id;wallSave();
      if(!wallMem){localStorage.removeItem(BG_KEY);localStorage.removeItem(BG_DIM)}
    }else if(wall.id){
      const img=await wallFull(wall.id);
      if(img&&WALL_RE.test(img)){wall.img=img;paintWall()}
      else{wall.id='';wallSave()}
    }
  }catch(e){}
}

async function wallUse(id){

    wall.id=id;wall.img=img;wallSave();paintWall();wallRender();
  }catch(e){toast('เปิดรูปนี้ไม่ได้ ลองใช้รูปอื่น')}

async function wallAdd(files){
  const good=files.filter(f=>/^image\/(png|jpeg|webp|gif|bmp)$/.test(f.type));
  if(!good.length){toast('ใช้ได้เฉพาะไฟล์ PNG, JPG, WEBP, GIF หรือ BMP');return}
  let last='';
  for(const f of good){
    if(wall.list.length>=WALL_MAX){toast('คลังเต็มแล้ว ลบรูปเก่าก่อน');break}
    try{
      const made=await wallMake(f),meta={id:'w-'+uid(),name:String(f.name||'Wallpaper').replace(/\.[^.]+$/,'').slice(0,60)||'Wallpaper',at:Date.now(),thumb:made.thumb};
      await wallPut(meta,made.img);
      wall.list.unshift(meta);last=meta.id;
    }catch(e){toast(e.message==='big'?'รูปใหญ่เกิน 25 MB':e.message==='bad'?'เปิดรูปนี้ไม่ได้ ลองใช้รูปอื่น':'พื้นที่ในเครื่องไม่พอ ลองลบรูปเก่า');break}
  }
  if(last){wall.view='lib';await wallUse(last);toast('เพิ่มรูปแล้ว')}
}
async function wallClick(e){
  const mode=e.target.closest('[data-wmode]');
  if(mode){
    skin=mode.dataset.wmode||null;
    try{if(skin) localStorage.setItem('dn-skin',skin);else localStorage.removeItem('dn-skin')}catch(err){}
    applySkin();wallRender();return;
  }
  const b=e.target.closest('[data-wact]');if(!b) return;
  const a=b.dataset.wact,card=b.closest('.wcard'),id=card&&card.dataset.id;
  if(a==='add') $('#wFile').click();
  else if(a==='none'){wall.id='';wall.img='';wallSave();paintWall();wallRender()}
  else if(a==='use') wallUse(id);
  else if(a==='reset-look'){wall.blur=0;wall.pblur=0;wall.tones[wallTone()]=WALL_TONES()[wallTone()];wallSave();paintWall();wallRender()}

    if(!b.classList.contains('sure')){
      b.classList.add('sure');b.textContent=tr('ยืนยันลบ');
      setTimeout(()=>{if(b.isConnected){b.classList.remove('sure');b.textContent='×'}},3000);
      return;

      await wallRemove(id);
      wall.list=wall.list.filter(x=>x.id!==id);
      if(wall.id===id){wall.id='';wall.img='';wallSave();paintWall()}
      wallRender();toast('ลบรูปแล้ว');
    }catch(err){toast('พื้นที่ในเครื่องไม่พอ ลองลบรูปเก่า')}

}

function placeSlot(d,y){

  const next=others.find(o=>{const r=o.getBoundingClientRect();return vertical?y<r.top+r.height/2:x<r.left+r.width/2});
  const last=others[others.length-1];
  const same=next?(d.slot.nextElementSibling===next||(d.slot.nextElementSibling===d.el&&d.el.nextElementSibling===next)):(last.nextElementSibling===d.slot||(last.nextElementSibling===d.el&&d.el.nextElementSibling===d.slot));

function finishDrag(commit){
  const d=drag;drag=null;
  if(!d||!d.active) return;
  dragClickGuard=Date.now();
  document.body.classList.remove('is-dragging');
  if(commit&&d.el.isConnected){
    d.parent.insertBefore(d.el,d.slot);d.slot.remove();
    const ids=dragPeers(d).map(x=>dragId(d,x));
    if(ids.join()!==d.before){
      if(d.type==='char'){
        const ordered=ids.map(id=>S.chars.find(c=>c.id===id));
        if(ordered.length===S.chars.length&&ordered.every(Boolean)) S.chars=ordered;
      }else if(d.type==='row'){
        const g=S.groups.find(x=>x.items.some(y=>y.id===d.el.dataset.row));
        if(g&&ids.length===g.items.length) g.items=ids.map(id=>g.items.find(y=>y.id===id));
      }else{
        const ordered=ids.map(id=>S.groups.find(x=>x.id===id));let k=0;
        S.groups=S.groups.map(x=>x.kind===d.el.dataset.kind?ordered[k++]:x);

document.addEventListener('pointerdown',e=>{

    if(h.dataset.moveGroup){el=h.closest('.group');type='group'}else{el=h.closest('.row');type='row'}

    if(e.pointerType!=='mouse'||e.target.closest('button,input,select,textarea,a,label')) return;

  if(!el) return;
  e.preventDefault();

  try{e.target.setPointerCapture(e.pointerId)}catch(err){}

document.addEventListener('pointermove',e=>{

    beginDrag(drag);
  }
  e.preventDefault();

    drag.el.style.left=(e.clientX-drag.offX)+'px';
    if(charVertical(drag)) drag.el.style.top=(e.clientY-drag.offY)+'px';

// Character tabs: drag with a mouse, the ≡ handle, or a touch-and-hold so the strip can still be swiped.
const cancelCharPress=()=>{if(charPress){clearTimeout(charPress.timer);charPress=null}};
document.addEventListener('pointerdown',e=>{
  if(drag||e.button!==0||dlg.open) return;
  const tab=e.target.closest('.tab[data-char]');
  if(!tab||S.chars.length<2) return;
  const grip=e.target.closest('.tab-grip');
  if(e.pointerType==='mouse'||grip){
    if(grip) e.preventDefault();
    drag={el:tab,type:'char',id:e.pointerId,x:e.clientX,y:e.clientY,active:false};
    return;
  }
  cancelCharPress();
  const p={id:e.pointerId,x:e.clientX,y:e.clientY,el:tab};
  p.timer=setTimeout(()=>{
    if(charPress!==p||!p.el.isConnected) return;
    charPress=null;
    drag={el:p.el,type:'char',id:p.id,x:p.x,y:p.y,active:false};
    beginDrag(drag);
    if(navigator.vibrate) navigator.vibrate(12);

document.addEventListener('pointermove',e=>{

  if(focusedTab&&e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
    e.preventDefault();
    const k=S.chars.findIndex(c=>c.id===focusedTab.dataset.char),to=k+(e.key==='ArrowLeft'?-1:1);
    if(k<0||to<0||to>=S.chars.length) return;

  }
  const h=e.target.closest&&e.target.closest('.drag');
  if(!h||(e.key!=='ArrowUp'&&e.key!=='ArrowDown')) return;

  const step=e.key==='ArrowUp'?-1:1;
  if(h.dataset.moveItem){
    const owner=S.groups.find(x=>x.items.some(y=>y.id===h.dataset.moveItem)),k=owner.items.findIndex(y=>y.id===h.dataset.moveItem),to=k+step;
    if(to<0||to>=owner.items.length) return;

    const g=S.groups.find(x=>x.id===h.dataset.moveGroup),same=S.groups.filter(x=>x.kind===g.kind),other=same[same.indexOf(g)+step];

// Device sync. Only the standalone build has a config, so the Claude-hosted copy stays local.
// Each person's data lives in one Firestore document whose id is their private 160-bit code.
const SYNC_CFG=window.DN_SYNC_CONFIG||null;
const SYNC_KEYS={code:'dn-sync-code',at:'dn-sync-at',client:'dn-sync-client'};
const HOME_SKIP='dn-sync-skip';
const SYNC_TEXT={off:'ยังไม่เชื่อม',connecting:'กำลังเชื่อม',saving:'กำลังซิงก์',ok:'ซิงก์แล้ว',offline:'ออฟไลน์',error:'ซิงก์ไม่สำเร็จ'};
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const FB_VER='10.14.1';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{if(v===null) localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}};
const sync={code:'',client:'',db:null,unsub:null,ready:false,seen:false,state:'off',last:'',localAt:0,remoteAt:0,timer:null,pending:null};
if(SYNC_CFG){
  const saved=normalizeCode(lsGet(SYNC_KEYS.code)||'');
  if(saved){sync.code=saved;sync.state='connecting';sync.localAt=Number(lsGet(SYNC_KEYS.at))||0}
  sync.client=lsGet(SYNC_KEYS.client)||randomChars(16);

}
function randomChars(n){
  const b=new Uint8Array(n);crypto.getRandomValues(b);
  return Array.from(b,x=>CODE_CHARS[x&31]).join('');
}
function normalizeCode(s){
  const c=String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==32||[...c].some(x=>!CODE_CHARS.includes(x))) return '';
  return c.match(/.{4}/g).join('-');
}
const syncJson=()=>JSON.stringify({v:S.v,chars:S.chars,groups:S.groups,progress:S.progress,stamps:S.stamps});
const syncUrl=()=>location.origin+location.pathname+'#link='+sync.code;
function syncPill(){
  if(!SYNC_CFG) return '';
  return '<button class="skin snd syncp" data-act="sync" data-fk="sync" data-state="'+sync.state+'">'+svg('<rect x="2" y="5" width="13" height="10" rx="1.5"/><path d="M6 19h5"/><rect x="17" y="8" width="5" height="11" rx="1"/>')+'อุปกรณ์: <span data-sync-label>'+SYNC_TEXT[sync.state]+'</span></button>';
}
function setSyncState(s){
  sync.state=s;
  const p=$('.syncp');if(!p) return;
  p.dataset.state=s;
  const l=p.querySelector('[data-sync-label]');if(l) l.textContent=tr(SYNC_TEXT[s]);
}
function afterSave(){
  if(!SYNC_CFG||!sync.code) return;
  const j=syncJson();
  if(syncQuiet){sync.last=j;return}
  if(j===sync.last) return;
  sync.last=j;
  sync.localAt=Math.max(Date.now(),sync.remoteAt+1,sync.localAt+1);
  lsSet(SYNC_KEYS.at,String(sync.localAt));
  schedulePush();

function schedulePush(){

  sync.timer=setTimeout(pushSync,500);
}
async function pushSync(){
  clearTimeout(sync.timer);
  if(!sync.ready||!sync.code) return;
  const code=sync.code,payload=sync.last,at=sync.localAt;
  if(payload.length>700000){setSyncState('error');toast('ข้อมูลใหญ่เกินกว่าจะซิงก์ ลองลดจำนวนรูปตัวละคร');return}
  try{
    await sync.db.collection('trackers').doc(code).set({payload,updatedAt:at,client:sync.client});
    if(code===sync.code&&at===sync.localAt){sync.remoteAt=Math.max(sync.remoteAt,at);setSyncState('ok')}
  }catch(e){if(code===sync.code) setSyncState('error')}
}
function loadScript(src){return new Promise((ok,no)=>{

async function firebaseDb(){
  if(sync.db) return sync.db;
  if(!window.firebase||!window.firebase.firestore){
    await loadScript('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-firestore-compat.js');

function onSyncSnap(snap){

    sync.ready=true;sync.seen=true;
    if(!sync.localAt){sync.localAt=Date.now();lsSet(SYNC_KEYS.at,String(sync.localAt))}
    sync.last=syncJson();
    pushSync();

    setSyncState('ok');return;
  }
  if(sync.localAt>d.updatedAt){schedulePush();return}
  let next;
  try{next=clean({...S,...JSON.parse(d.payload),active:S.active,view:S.view,hideDone:S.hideDone,collapsed:S.collapsed})}
  catch(e){setSyncState('error');return}

function unlinkSync(){

function createSync(){

// Local restore points. A new one is kept at most every 10 minutes, so a burst of unwanted edits
// cannot push the last good copy out of the list.
const UNDO_KEY='dn-sync-undo',UNDO_GAP=600000,CODE_MASK='••••-••••-••••-••••-••••-••••-••••-••••';
let secretTimer=null,hideSecret=null;
dlg.addEventListener('close',()=>{if(hideSecret) hideSecret()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&hideSecret) hideSecret()});
function readUndo(){
  try{const a=JSON.parse(lsGet(UNDO_KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.at==='number'&&typeof x.data==='string'):[]}
  catch(e){return []}
}
function rememberSnapshot(force){
  const data=syncJson(),list=readUndo();
  if(list[0]&&list[0].data===data) return;
  if(!force&&list[0]&&Date.now()-list[0].at<UNDO_GAP) return;
  let next=[{at:Date.now(),data},...list].slice(0,3);
  while(next.length>1&&JSON.stringify(next).length>900000) next=next.slice(0,-1);
  while(next.length){
    try{localStorage.setItem(UNDO_KEY,JSON.stringify(next));return}
    catch(e){next=next.slice(0,-1)}
  }
}
function restoreSnapshot(entry){
  let next;
  try{next=clean({...S,...JSON.parse(entry.data),active:S.active,view:S.view,hideDone:S.hideDone,collapsed:S.collapsed})}
  catch(e){toast('ย้อนข้อมูลไม่สำเร็จ');return}
  rememberSnapshot(true);
  S=next;
  syncQuiet=true;applyResets();syncQuiet=false;
  sync.last='';
  save();
  toast('ย้อนข้อมูลแล้ว');
}
const undoButton=()=>readUndo().length?'<div class="sync-or"></div><button type="button" class="btn small" id="sUndo">ย้อนข้อมูลล่าสุด</button>':'';
function bindUndo(){const b=$('#sUndo',dlg);if(b) b.onclick=undoForm}
function undoForm(){
  const list=readUndo(),fmt=at=>new Date(at).toLocaleString(lang==='en'?'en-GB':'th-TH',{dateStyle:'short',timeStyle:'short'});
  modal('ย้อนข้อมูล','<p class="note">เลือกเวลาที่ต้องการกลับไป ข้อมูลปัจจุบันจะถูกเก็บไว้ให้ย้อนกลับได้</p><div class="undo-list">'+list.map((x,i)=>'<button type="button" class="btn" data-undo="'+i+'">'+keep(fmt(x.at))+'</button>').join('')+'</div>',null,null);
  dlg.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{
    const entry=list[Number(b.dataset.undo)];
    modal('ย้อนไปข้อมูลนี้?','<p class="note">ข้อมูลบนทุกเครื่องที่เชื่อมอยู่จะกลับไปเป็นชุดนี้</p>','ย้อนข้อมูล',()=>{restoreSnapshot(entry)},true);
  });
}
function parseLinkCode(s){
  const t=String(s||'').trim(),m=t.match(/#(?:link|home)=([A-Za-z0-9-]{32,64})/);
  return normalizeCode(m?m[1]:t);
}
const isStandalone=()=>{
  try{return navigator.standalone===true||matchMedia('(display-mode: standalone)').matches}catch(e){return false}
};
function linkBanner(){
  if(!SYNC_CFG||sync.code||!isStandalone()||lsGet('dn-link-banner-off')) return '';
  return '<div class="linkbanner"><div><b>ไอคอนนี้ยังไม่เชื่อม Device</b><small>สแกน QR จากคอมหรือเครื่องที่เชื่อมอยู่ เพื่อดึงข้อมูลมาใช้</small></div><div class="btnrow"><button class="btn primary small" data-act="sync">เชื่อมเลย</button><button class="btn small" data-act="hide-link" aria-label="ซ่อนข้อความนี้">ซ่อน</button></div></div>';
}
function askJoin(code){
  if(code===sync.code){if(dlg.open) dlg.close();toast('เชื่อมอุปกรณ์แล้ว');return}
  const fresh=S.chars.length===1&&!Object.values(S.progress).some(p=>Object.keys(p).length);
  if(fresh){if(dlg.open) dlg.close();joinSync(code);return}
  modal('เชื่อมอุปกรณ์นี้?','<p class="note">ข้อมูลในเครื่องนี้จะถูกแทนที่ด้วยข้อมูลจากเครื่องที่สร้าง QR</p>','เชื่อมเลย',()=>{joinSync(code)});
}
// Scan inside the page, because the iPhone camera app always opens QR links in Safari, not the home screen app.
async function scanForm(){
  modal('สแกน QR','<div class="scanbox"><video id="qVideo" playsinline muted autoplay></video><i aria-hidden="true"></i></div><p class="note" id="qNote">ส่องกล้องไปที่ QR บนเครื่องที่เชื่อมอยู่</p>',null,null);
  const video=$('#qVideo',dlg),note=$('#qNote',dlg),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
  let stream=null,alive=true,frame=0;
  const stop=()=>{
    alive=false;cancelAnimationFrame(frame);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=null;video.srcObject=null;
  };
  const fail=msg=>{stop();note.textContent=tr(msg);note.className='err'};
  dlg.addEventListener('close',stop,{once:true});
  dlg.oncancel=stop;
  $('#fCancel',dlg).onclick=()=>{stop();dlg.close()};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail('อุปกรณ์นี้เปิดกล้องในเว็บไม่ได้ ใช้ปุ่มวางรหัสแทน');return}
  try{
    if(!window.jsQR) await loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js');
    if(!alive) return;
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    if(!alive){stream.getTracks().forEach(t=>t.stop());return}
    video.srcObject=stream;
    await video.play();
  }catch(e){
    fail(e&&e.name==='NotAllowedError'?'กล้องถูกปิดสิทธิ์ อนุญาตกล้องในการตั้งค่า หรือใช้ปุ่มวางรหัสแทน':'เปิดกล้องไม่ได้ ใช้ปุ่มวางรหัสแทน');
    return;
  }
  const read=()=>{
    if(!alive) return;
    if(video.readyState>=2&&video.videoWidth){
      const scale=Math.min(1,640/Math.max(video.videoWidth,video.videoHeight));
      canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      const img=ctx.getImageData(0,0,canvas.width,canvas.height),hit=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
      if(hit&&hit.data){
        let same=true;
        try{if(/^https?:/i.test(hit.data)) same=new URL(hit.data).origin===location.origin}catch(e){same=false}
        const code=same?parseLinkCode(hit.data):'';
        if(code){stop();tok(SND.up);askJoin(code);return}
        note.textContent=tr('QR นี้ไม่ใช่รหัสของ Dragon Nest Tracker');
      }
    }
    frame=requestAnimationFrame(read);
  };
  read();
}
// iPhone home screen apps have storage separate from Safari, and iCloud syncs only a bookmark's URL.
// This briefly puts the code in the URL so a saved icon or bookmark can link itself when opened.
function homeLinkForm(){
  modal('สร้างบุ๊กมาร์กแบบเชื่อมแล้ว',

    'เสร็จแล้ว',()=>{});
  const manifest=$('link[rel="manifest"]');
  let timer=null,on=false;
  const finish=()=>{
    if(!on) return;
    on=false;clearTimeout(timer);
    history.replaceState(null,'',location.pathname+location.search);
    if(manifest&&!manifest.isConnected) document.head.appendChild(manifest);
  };
  // Clear the code in the same tick as every way of closing. The close event can be delayed.
  dlg.addEventListener('close',finish,{once:true});
  $('#fCancel',dlg).onclick=()=>{finish();dlg.close()};
  $('form',dlg).addEventListener('submit',finish,true);

    history.replaceState(null,'',location.pathname+'#home='+sync.code);
    $('#hIntro',dlg).hidden=true;$('#hSteps',dlg).hidden=false;
    timer=setTimeout(()=>{finish();if(dlg.open) dlg.close()},180000);
  };
}
function syncForm(){
  if(!sync.code){

  modal('เชื่อมอุปกรณ์',
    '<div class="qrguard"><div class="qrwrap" id="sQr" hidden></div><div class="qrcover" id="sCover">'+svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>')+'<b>QR ถูกซ่อนไว้</b><small>กดเมื่อไม่ได้สตรีมหรือแชร์จอ</small><button type="button" class="btn primary small" id="sReveal">แสดง QR</button></div></div><button type="button" class="btn small" id="sHide" hidden>ซ่อน QR</button><p class="note">สแกน QR นี้ด้วยมือถือหรือ iPad เพื่อเชื่อม อย่าส่งให้คนอื่น เพราะใครมีรหัสจะแก้ข้อมูลได้</p><label class="field">รหัสเชื่อมต่อ<input id="sShow" readonly value="'+CODE_MASK+'"></label><div class="btnrow"><button type="button" class="btn small" id="sCopyLink" disabled>คัดลอกลิงก์</button><button type="button" class="btn small" id="sCopyCode" disabled>คัดลอกรหัส</button></div><button type="button" class="btn small" id="sHome">สร้างบุ๊กมาร์กแบบเชื่อมแล้ว</button><div class="sync-or"></div><div class="btnrow"><button type="button" class="btn small danger" id="sRotate">เปลี่ยนรหัส</button><button type="button" class="btn small danger" id="sUnlink">เลิกเชื่อมเครื่องนี้</button></div>'+undoButton(),
    null,null);
  bindUndo();
  $('#sHome',dlg).onclick=homeLinkForm;
  const qr=$('#sQr',dlg),cover=$('#sCover',dlg),shown=$('#sShow',dlg),hideBtn=$('#sHide',dlg),copies=[$('#sCopyLink',dlg),$('#sCopyCode',dlg)];
  const hideNow=()=>{
    clearInterval(secretTimer);secretTimer=null;
    qr.innerHTML='';qr.removeAttribute('title');qr.hidden=true;cover.hidden=false;hideBtn.hidden=true;
    shown.value=CODE_MASK;copies.forEach(b=>b.disabled=true);
  };
  hideSecret=hideNow;
  hideNow();
  hideBtn.onclick=hideNow;
  // Clear the QR in the same tick as every way of closing, so it never lingers in the page.
  $('#fCancel',dlg).onclick=()=>{hideNow();dlg.close()};
  $('form',dlg).addEventListener('submit',hideNow,true);
  dlg.oncancel=hideNow;
  $('#sReveal',dlg).onclick=()=>{
    let left=30;
    const label=()=>hideBtn.textContent=tr('ซ่อน QR')+' ('+left+')';
    clearInterval(secretTimer);
    qr.hidden=false;cover.hidden=true;hideBtn.hidden=false;
    shown.value=sync.code;copies.forEach(b=>b.disabled=false);
    label();drawQr(qr);
    secretTimer=setInterval(()=>{
      if(!qr.isConnected||!dlg.open){hideNow();return}
      left--;
      if(left<=0) hideNow();else label();

  };
  $('#sCopyLink',dlg).onclick=()=>copyText(syncUrl(),'คัดลอกลิงก์แล้ว',$('#sShow',dlg));
  $('#sCopyCode',dlg).onclick=()=>copyText(sync.code,'คัดลอกรหัสแล้ว',$('#sShow',dlg));
  $('#sRotate',dlg).onclick=()=>modal('เปลี่ยนรหัสเชื่อมต่อ?','<p class="note">เครื่องอื่นที่เชื่อมอยู่จะหลุด และต้องสแกน QR ใหม่</p>','เปลี่ยนรหัส',()=>{rotateSync()},true);
  $('#sUnlink',dlg).onclick=()=>modal('เลิกเชื่อมเครื่องนี้?','<p class="note">ข้อมูลยังอยู่ในเครื่องนี้ แต่จะไม่ซิงก์กับเครื่องอื่นอีก</p>','เลิกเชื่อม',()=>{unlinkSync();toast('เลิกเชื่อมแล้ว')},true);
}
function bootSync(){
  if(!SYNC_CFG) return;
  window.addEventListener('online',()=>{if(sync.code&&sync.ready) sync.localAt>sync.remoteAt?pushSync():setSyncState('ok')});
  window.addEventListener('offline',()=>{if(sync.code) setSyncState('offline')});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&sync.timer&&sync.ready&&sync.localAt>sync.remoteAt) pushSync()});
  const h=location.hash.match(/^#link=([A-Za-z0-9-]{32,64})$/);
  const linked=h?normalizeCode(h[1]):'';
  const hm=location.hash.match(/^#home=([A-Za-z0-9-]{32,64})$/);
  const homeCode=hm?normalizeCode(hm[1]):'';
  if(h||hm) history.replaceState(null,'',location.pathname+location.search);
  if(sync.code) connectSync(sync.code);
  else if(homeCode&&homeCode!==lsGet(HOME_SKIP)){
    const fresh=S.chars.length===1&&!Object.values(S.progress).some(p=>Object.keys(p).length);
    if(fresh) joinSync(homeCode);
    else modal('เชื่อมอุปกรณ์นี้?','<p class="note">ข้อมูลในเครื่องนี้จะถูกแทนที่ด้วยข้อมูลจากเครื่องที่สร้าง QR</p>','เชื่อมเลย',()=>{joinSync(homeCode)});
  }
  if(linked&&linked!==sync.code){
    modal('เชื่อมอุปกรณ์นี้?','<p class="note">ข้อมูลในเครื่องนี้จะถูกแทนที่ด้วยข้อมูลจากเครื่องที่สร้าง QR</p>','เชื่อมเลย',()=>{joinSync(linked)});
  }
}

// Refresh button and new-version check. Only the standalone build has a build id.
const BUILD=window.DN_BUILD||'';
let updateReady=false,updateChecked=0;
function updatePill(){
  if(!BUILD||!updateReady) return '';
  return '<button class="skin snd upd'+(updateReady?' ready':'')+'" data-act="refresh" data-fk="refresh">'+svg('<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>')+'<span data-upd-label>'+(updateReady?'มีเวอร์ชันใหม่ กดอัปเดต':'รีเฟรช')+'</span></button>';
}
async function checkUpdate(){
  if(!BUILD||updateReady||document.hidden) return;
  updateChecked=Date.now();
  try{
    const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const m=(await r.text()).match(/window\.DN_BUILD="([a-f0-9]{12})"/);
    if(!m||m[1]===BUILD) return;
    updateReady=true;
    if(!drag) render();
    toast('มีเวอร์ชันใหม่ กดปุ่มอัปเดตด้านบน');
  }catch(e){}
}
async function refreshPage(btn){
  if(btn){
    btn.disabled=true;
    const l=btn.querySelector('[data-upd-label]');if(l) l.textContent=tr('กำลังรีเฟรช');
  }
  // Progress is already saved locally. Give any waiting sync a moment to finish first.
  try{
    if(SYNC_CFG&&sync.ready&&sync.localAt>sync.remoteAt) await Promise.race([pushSync(),new Promise(r=>setTimeout(r,1500))]);
  }catch(e){}
  location.replace(location.pathname+'?u='+Date.now());
}
// Pull down from the top to refresh, for home screen apps and in-app browsers with no reload button.
function setupPullRefresh(){
  if(!isTouch()) return;
  document.documentElement.classList.add('ptr-on');
  const box=document.createElement('div');
  box.id='ptr';box.hidden=true;box.setAttribute('role','status');
  box.innerHTML=svg('<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>')+'<span></span>';
  document.body.appendChild(box);
  const icon=box.querySelector('svg'),text=box.querySelector('span'),READY=70;
  let start=null,pulling=false,dist=0,busy=false;
  const reset=()=>{start=null;pulling=false;dist=0;if(!busy) box.hidden=true};
  const paint=()=>{
    box.hidden=false;
    box.style.transform='translate(-50%,'+(dist-56)+'px)';
    icon.style.transform='rotate('+dist*3+'deg)';
    text.textContent=tr(dist>=READY?'ปล่อยเพื่อรีเฟรช':'ดึงลงเพื่อรีเฟรช');
  };
  document.addEventListener('touchstart',e=>{
    if(busy||e.touches.length!==1||window.scrollY>0||dlg.open||drag||e.target.closest('.drag,.tab,input,textarea,select')){start=null;return}
    start={x:e.touches[0].clientX,y:e.touches[0].clientY};pulling=false;dist=0;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!start||busy) return;
    if(e.touches.length!==1||dlg.open||drag){reset();return}
    const dy=e.touches[0].clientY-start.y,dx=e.touches[0].clientX-start.x;
    if(!pulling){
      if(dy<-4||window.scrollY>0||Math.abs(dx)>Math.abs(dy)+6){start=null;return}
      if(dy<10) return;
      pulling=true;
    }
    if(e.cancelable) e.preventDefault();
    dist=Math.max(0,Math.min(110,dy*.5));
    paint();
  },{passive:false});
  document.addEventListener('touchend',()=>{
    if(!start) return;
    if(pulling&&dist>=READY){
      busy=true;dist=READY;paint();
      text.textContent=tr('กำลังรีเฟรช');
      icon.classList.add('spin');
      tok(SND.soft);
      refreshPage();
    }
    reset();
  },{passive:true});
  document.addEventListener('touchcancel',reset,{passive:true});
}
function bootUpdate(){
  if(!BUILD) return;
  if(/[?&]u=\d+/.test(location.search)) history.replaceState(null,'',location.pathname+location.hash);
  setupPullRefresh();
  setTimeout(checkUpdate,3000);
  setInterval(checkUpdate,1800000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-updateChecked>600000) checkUpdate()});
}

function tick(){
  if(sync.pending&&!dlg.open&&!drag) applyRemote(sync.pending);
  const r=applyResets();
  if(r&&!dlg.open){render();toast(r.includes('weekly')?'รีเซ็ตรายสัปดาห์แล้ว':'รีเซ็ตรายวันแล้ว')}
  const now=Date.now(),a=$('#cdD'),b=$('#cdW');
  if(a) a.textContent=cd(dayStart(now)+D-now);
  if(b) b.textContent=cd(weekStart(now)+W-now);
}
paintWall();wallBoot();syncQuiet=true;applyResets();save();syncQuiet=false;render();setInterval(tick,1000);bootUpdate();bootSync();
document.addEventListener('visibilitychange',()=>{if(!document.hidden) tick()});
})();
